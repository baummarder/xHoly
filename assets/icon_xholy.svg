<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="xHoly">
  <title>xHoly</title>
  <!-- App icon: stylised gold X inside a gold-on-black cross frame. -->
  <rect x="0" y="0" width="256" height="256" rx="40" fill="#050505"/>
  <rect x="2" y="2" width="252" height="252" rx="38" fill="none" stroke="#FFD700" stroke-width="3"/>

  <!-- Cross frame (black fill, fine gold outline). -->
  <path d="M100 20 H156 V100 H236 V156 H156 V236 H100 V156 H20 V100 H100 Z"
        fill="#0A0A0A" stroke="#FFD700" stroke-width="3" stroke-linejoin="round"/>

  <!-- The X: two rotated gold bars. -->
  <g fill="#FFD700">
    <rect x="115" y="52" width="26" height="152" rx="8" transform="rotate(45 128 128)"/>
    <rect x="115" y="52" width="26" height="152" rx="8" transform="rotate(-45 128 128)"/>
  </g>

  <!-- Centre node. -->
  <circle cx="128" cy="128" r="15" fill="#050505" stroke="#FFD700" stroke-width="3"/>
  <circle cx="128" cy="128" r="5" fill="#FFD700"/>

  <!-- Small crucifix, top-right (the xHoly signature). -->
  <g fill="#FFD700">
    <rect x="192" y="42" width="8" height="40" rx="2"/>
    <rect x="183" y="48" width="26" height="8" rx="2"/>
  </g>
</svg>
