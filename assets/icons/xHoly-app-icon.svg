<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">xHoly app icon</title>
  <desc id="desc">xHoly app icon: bold gold X with a glowing crucifix at the top right inside a sphere ring, gold frame on a dark rounded-square background.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="55%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#d9a800"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Sphere ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.9"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.25"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="256" r="118" fill="#ffd700" opacity="0.07"/>

  <!-- The X -->
  <g transform="translate(256 256)">
    <g transform="rotate(-45)">
      <rect x="-30" y="-120" width="60" height="240" rx="15" fill="url(#gold)"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-30" y="-120" width="60" height="240" rx="15" fill="url(#gold)"/>
    </g>
  </g>

  <!-- Center node -->
  <circle cx="256" cy="256" r="30" fill="#141414"/>
  <circle cx="256" cy="256" r="30" fill="none" stroke="url(#gold)" stroke-width="9"/>
  <circle cx="256" cy="256" r="9" fill="url(#gold)"/>

  <!-- Crucifix at the top right -->
  <g transform="translate(348 140)">
    <rect x="-17" y="-55" width="34" height="110" rx="9" fill="url(#gold)"/>
    <rect x="-45" y="-42" width="90" height="28" rx="10" fill="url(#gold)"/>
  </g>

  <!-- Gold frame with glow -->
  <rect x="14" y="14" width="484" height="484" rx="102" fill="none"
        stroke="url(#gold)" stroke-width="10" opacity="0.95" filter="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="102" fill="none"
        stroke="url(#gold)" stroke-width="5"/>
</svg>
