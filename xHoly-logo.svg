<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">xHoly logo</title>
  <desc id="desc">A bold gold X with a small crucifix at the top right, inside a sphere ring on a dark rounded-square background.</desc>

  <!-- Background: dark neutral -->
  <rect width="512" height="512" rx="112" fill="#1a1a1a"/>

  <!-- Xbox-style sphere ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FFD700" stroke-width="10" opacity="0.9"/>

  <!--
    The X: two thick gold bars crossing at the center.
    Half-length 130 keeps the tips inside the ring (130*sqrt(2) ≈ 184 < 196).
  -->
  <g transform="translate(256 256)">
    <g transform="rotate(-45)">
      <rect x="-32" y="-130" width="64" height="260" rx="16" fill="#FFD700"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-32" y="-130" width="64" height="260" rx="16" fill="#FFD700"/>
    </g>
  </g>

  <!-- Center node where the bars merge -->
  <circle cx="256" cy="256" r="30" fill="#1a1a1a"/>
  <circle cx="256" cy="256" r="30" fill="none" stroke="#FFD700" stroke-width="9"/>
  <circle cx="256" cy="256" r="9" fill="#FFD700"/>

  <!-- Crucifix at the top right, next to the X -->
  <g transform="translate(352 148)">
    <!-- vertical beam -->
    <rect x="-17" y="-56" width="34" height="112" rx="9" fill="#FFD700"/>
    <!-- horizontal beam near the top -->
    <rect x="-46" y="-42" width="92" height="28" rx="9" fill="#FFD700"/>
  </g>
</svg>
