[package]
name = "xholy"
version = "0.1.0"
edition = "2021"
description = "xHoly - research HLE emulator for Xbox Series X|S titles"
license = "Apache-2.0"
repository = "https://github.com/baummarder/xHoly"
keywords = ["emulator", "xbox", "research"]
categories = ["emulators", "game-engines"]

[lib]
name = "xholy"
path = "src/lib.rs"

[[bin]]
name = "xholy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
notify = "8"
pollster = "0.4"
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
wgpu = "24"
# Maintained cross-platform Discord IPC client (MIT, v1.1.0).
discord-rich-presence = "1.1.0"

[features]
default = []
# Reserved for Phase 24C (isolation of the Phase-1 ARM64 scaffold). Currently
# has no code effect — no `cfg(feature = "legacy-arm64")` exists yet.
legacy-arm64 = []
# Compatibility alias for the former cpu-stub flag. Intentionally empty: the
# old flag gated nothing, so pulling in another feature would be misleading.
cpu-stub = []
# Xbox 360 leftovers (PowerPC decoder, Xenia XAM ordinals). Outside the target
# scope; gates core::ppc and core::kernel::xam_abi.
legacy-xbox360 = []

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[bench]]
name = "emulation"
harness = false
